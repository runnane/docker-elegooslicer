---
services:
  elegooslicer:
    build: .
    container_name: elegooslicer
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Oslo
      - DISPLAY=:99            # Avoid conflict with host X server when using host networking
      - CUSTOM_PORT=3100       # Default: 3000
      - CUSTOM_HTTPS_PORT=3101 # Default: 3001
      # - CUSTOM_USER=abc      # Optional: custom username
      # - PASSWORD=changeme    # Optional: password for basic auth
      # - PIXELFLUX_WAYLAND=true  # Optional: enable Wayland mode for GPU acceleration
    volumes:
      - ./config:/config
      - ../gcode:/gcode:ro     # Optional: mount gcode output directory
      - /mnt/filestore/3dprint:/3dprint
    network_mode: host         # Required for UDP broadcast printer discovery
    shm_size: "4gb"            # Increased from 1gb: Xvfb runs at 15360x8640 and Selkies uses XShm capture; 1gb starves under load and causes stream stalls
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    # For Nvidia GPU, see README for runtime configuration
    # Healthcheck: surfaces both classes of "UI frozen" stalls we have seen:
    #   1. Selkies HTTP port unresponsive (web stack down)
    #   2. Xvfb window tree contains a dangling drawable from a leaked WebKit
    #      subprocess — slicer GUI thread wedges on BadDrawable until the
    #      container is restarted (Xvfb-side state corruption, see README).
    # Pair with willfarrell/autoheal (label below) to actually recover.
    labels:
      - autoheal=true
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          set -e
          curl -fsS --max-time 5 http://localhost:${CUSTOM_PORT:-3100}/ >/dev/null
          # Probe X11: enumerate root children and try to read each. If any throws
          # BadDrawable / BadWindow, the X session is poisoned and we are frozen.
          DISPLAY=:99 xwininfo -root -tree 2>&1 | grep -qE "Bad ?(Drawable|Window)" && exit 1
          exit 0
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s
